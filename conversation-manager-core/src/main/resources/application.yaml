server:
    port: 32764

spring:
    application:
        name: conversation-manager
    profiles:
        active: local
    jackson:
        time-zone: UTC
        default-property-inclusion: ALWAYS

mybatis:
    mapper-locations:
        - classpath:mappers/*.xml
    type-handlers-package: ifl.agentbreaker.conversationmanager.dao.typehandlers

dubbo:
    application:
        name: ${spring.application.name}
        qos-enable: false
    protocol:
        name: tri
        port: 20880

logging:
    pattern:
        console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([trace_id=%X{traceId:-} span_id=%X{spanId:-}]){magenta} %clr([%thread]){faint} %clr(%-40.40logger{39}){cyan} %L %clr(:){faint} %m%n"
    level:
        root: INFO

management:
    tracing:
        export:
            enabled: true
            otlp:
                enabled: true
        propagation:
            consume: W3C
            produce: W3C
        sampling:
            probability: 1.0
    otlp:
        metrics:
            export:
                enabled: false
